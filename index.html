<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buyurtma</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: #083234; color: white; padding: 24px 20px; min-height: 100vh; }
        h2 { text-align: center; font-size: 22px; margin-bottom: 24px; color: #3ECFCF; }
        .field { margin-bottom: 16px; }
        label { display: block; font-size: 13px; color: rgba(255,255,255,0.6); margin-bottom: 6px; }
        input { width: 100%; padding: 14px 16px; border-radius: 10px; border: 1px solid rgba(62,207,207,0.3); background: rgba(255,255,255,0.08); color: white; font-size: 16px; outline: none; }
        .product-badge { background: rgba(62,207,207,0.12); border: 1px solid rgba(62,207,207,0.3); border-radius: 8px; padding: 10px 14px; font-size: 14px; color: #3ECFCF; margin-bottom: 20px; }
        .term-btn { flex: 1; padding: 12px; border: 1px solid #3ECFCF; background: transparent; color: #3ECFCF; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .term-btn.active { background: #3ECFCF; color: #083234; }
        #price-result { background: rgba(62,207,207,0.1); padding: 15px; border-radius: 10px; margin-bottom: 20px; display: none; text-align: center; }
    </style>
</head>
<body>

<div id="form-section">
    <h2>Ariza qoldirish</h2>
    <div class="product-badge" id="product-badge" style="display:none">📦 <span id="product-name-display"></span></div>

    <div class="field">
        <label>Muddatni tanlang</label>
        <div style="display: flex; gap: 10px; margin-bottom: 20px;">
            <button type="button" class="term-btn" onclick="setTerm(6)" id="term6">6 oy</button>
            <button type="button" class="term-btn" onclick="setTerm(9)" id="term9">9 oy</button>
            <button type="button" class="term-btn" onclick="setTerm(12)" id="term12">12 oy</button>
        </div>
    </div>

    <div id="price-result">
        <div style="font-size: 14px; color: #3ECFCF;">Jami: <span id="total-price">0</span> so'm</div>
        <div style="font-size: 18px; font-weight: bold; margin-top: 5px;">Oylik: <span id="monthly-price">0</span> so'm</div>
    </div>
    <div id="price-display" style="color: #3ECFCF; font-size: 20px; margin-bottom: 15px; font-weight: bold;">
    Tannarxi: <span id="display-price">0</span> so'm
</div>
    <div class="field"><label>Ismingiz</label><input type="text" id="name" placeholder="Ismingiz"></div>
    <div class="field"><label>Telefon raqamingiz</label><input type="tel" id="phone" placeholder="+998 90 123 45 67"></div>
</div>
<div id="success-message" style="display:none; text-align:center; padding: 50px 20px;">
    <div style="font-size: 50px; margin-bottom: 20px;">✅</div>
    <h2 style="color: #3ECFCF;">Buyurtmangiz qabul qilindi!</h2>
    <p style="color: rgba(255,255,255,0.7); margin-top: 10px;">Operatorlarimiz tez orada siz bilan bog'lanishadi.</p>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const urlParams = new URLSearchParams(window.location.search);
    const productName = decodeURIComponent(urlParams.get('product') || '');
    const basePrice = parseInt(urlParams.get('price')) || 0;
    let selectedMonths = 0;

    if (productName) {
        document.getElementById('product-name-display').textContent = productName;
        document.getElementById('product-badge').style.display = 'block';
    }

    function setTerm(months) {
        selectedMonths = months;
        document.querySelectorAll('.term-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('term' + months).classList.add('active');
        
        const markups = {6: 0.1568, 9: 0.224, 12: 0.2912};
        const total = Math.floor(basePrice * (1 + markups[months]));
        const monthly = Math.floor(total / months);
        
        document.getElementById('total-price').textContent = total.toLocaleString();
        document.getElementById('monthly-price').textContent = monthly.toLocaleString();
        document.getElementById('display-price').textContent = new Intl.NumberFormat('uz-UZ').format(basePrice);
        document.getElementById('price-result').style.display = 'block';
    }

    tg.MainButton.setText("Buyurtmani yuborish");
    tg.MainButton.show();
    
    tg.onEvent('mainButtonClicked', async function () {
    const name = document.getElementById('name').value.trim(); // .trim() bo'sh joylarni olib tashlaydi
    const phone = document.getElementById('phone').value.trim();
    
    // 1. TEKSHIRUV: Maydonlar bo'shligini tekshirish
    if (name === "" || phone === "" || selectedMonths === 0) {
        alert("Iltimos, ism va telefon raqamingizni kiriting!");
        return; // Kod shu yerda to'xtaydi va xabar yuborilmaydi
    }

    // Agar hammasi joyida bo'lsa, davom etamiz...
    const product = productName;
    const months = selectedMonths;
    const monthly = document.getElementById('monthly-price').textContent;
    
    const text = `🔔 *Yangi buyurtma!*\n\n` +
                 `📦 *Mahsulot:* ${product}\n` +
                 `💰 *Mahsulot narxi:* ${document.getElementById('display-price').textContent} so'm\n` + // Mana bu qatorni qo'shdik
                 `📅 *Muddat:* ${months} oy\n` +
                 `💰 *Oylik to'lov:* ${monthly} so'm\n` +
                 `👤 *Ismi:* ${name}\n` +
                 `📞 *Tel:* ${phone}`;

    // Xabarni yuborish
    const response = await fetch(`https://api.telegram.org/bot8827872980:AAHvvV97pfvG5zCCfC6Tw0ghOitW-avxa4Q/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
            chat_id: 1306354017, 
            text: text, 
            parse_mode: 'Markdown' 
        })
    });

    if (response.ok) {
        tg.MainButton.hide();
        document.getElementById('form-section').style.display = 'none';
        document.getElementById('success-message').style.display = 'block';
    } else {
        alert("Xatolik yuz berdi, qaytadan urinib ko'ring.");
    }
});
</script>
</body>
</html>
